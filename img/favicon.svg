<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo écologique du Lycée Oued Ellil">
  <title>Lycée Oued Ellil – logo écologique</title>
  <defs>
    <radialGradient id="fond" cx="38%" cy="28%" r="90%">
      <stop offset="0" stop-color="#22a35a"/>
      <stop offset=".6" stop-color="#15703c"/>
      <stop offset="1" stop-color="#0b3d24"/>
    </radialGradient>
    <linearGradient id="feuille" x1="150" y1="400" x2="372" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset=".55" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#f7fee7"/>
    </linearGradient>
    <linearGradient id="ombre" x1="372" y1="104" x2="240" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0"/>
      <stop offset="1" stop-color="#15803d" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="pageG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="pageD" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <clipPath id="disque"><circle cx="256" cy="256" r="236"/></clipPath>
    <g id="limbe">
      <path d="M150 400 C106 250 226 116 372 104 C400 252 300 402 150 400 Z" fill="url(#feuille)"/>
      <path d="M372 104 C400 252 300 402 150 400 C214 352 236 300 268 258 C304 212 340 168 372 104 Z" fill="url(#ombre)"/>
      <g fill="none" stroke="#14532d" stroke-width="5" stroke-linecap="round" opacity=".28">
        <path d="M232 322 C204 300 184 270 176 236"/>
        <path d="M270 262 C248 238 236 208 236 176"/>
        <path d="M312 208 C298 188 294 164 300 140"/>
        <path d="M246 306 C280 312 312 304 338 286"/>
        <path d="M286 248 C316 252 344 242 364 224"/>
      </g>
      <path d="M372 104 C344 164 318 204 286 238 C252 276 222 334 150 400 C232 346 270 294 302 256 C334 216 354 170 372 104 Z" fill="#14532d" opacity=".45"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="252" fill="#0b3d24"/>
  <circle cx="256" cy="256" r="236" fill="url(#fond)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#bbf7d0" stroke-width="3"/>

  <g clip-path="url(#disque)">
    <!-- halo -->
    <circle cx="256" cy="230" r="150" fill="#ffffff" opacity=".06"/>
    <!-- feuilles -->
    <use href="#limbe" transform="translate(256 384) rotate(-95) scale(.5) translate(-150 -400)"/>
    <use href="#limbe" transform="translate(256 384) rotate(-22) scale(.86) translate(-150 -400)"/>
    <!-- livre ouvert -->
    <path d="M256 462 C222 440 172 436 120 450 L120 382 C172 368 222 372 256 394 Z" fill="url(#pageG)"/>
    <path d="M256 462 C290 440 340 436 392 450 L392 382 C340 368 290 372 256 394 Z" fill="url(#pageD)"/>
    <path d="M256 394 V462" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <g fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round">
      <path d="M140 398 C176 390 212 394 238 408"/>
      <path d="M140 418 C176 410 212 414 238 428"/>
      <path d="M372 398 C336 390 300 394 274 408"/>
      <path d="M372 418 C336 410 300 414 274 428"/>
    </g>
  </g>
</svg>
