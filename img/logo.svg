<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo écologique du Lycée Oued Ellil">
  <title>Lycée Oued Ellil – logo écologique</title>
  <defs>
    <radialGradient id="nuit" cx="35%" cy="25%" r="90%">
      <stop offset="0" stop-color="#14614a"/>
      <stop offset=".55" stop-color="#0a3b30"/>
      <stop offset="1" stop-color="#041f1c"/>
    </radialGradient>
    <linearGradient id="feuille" x1="150" y1="400" x2="372" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset=".5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <linearGradient id="ombre" x1="372" y1="104" x2="240" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#065f46" stop-opacity="0"/>
      <stop offset="1" stop-color="#064e3b" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="oued" x1="372" y1="104" x2="110" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset=".6" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="eau" x1="0" y1="400" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lune" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="disque"><circle cx="256" cy="256" r="236"/></clipPath>
    <mask id="croissant">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="150" cy="150" r="50" fill="#fff"/>
      <circle cx="172" cy="136" r="43" fill="#000"/>
    </mask>
  </defs>

  <!-- médaillon -->
  <circle cx="256" cy="256" r="252" fill="#041f1c"/>
  <circle cx="256" cy="256" r="236" fill="url(#nuit)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#a7f3d0" stroke-width="3" opacity=".9"/>

  <g clip-path="url(#disque)">
    <!-- étoiles -->
    <g fill="#fef9c3">
      <circle cx="232" cy="92" r="4"/>
      <circle cx="92" cy="246" r="3.2" opacity=".8"/>
      <circle cx="418" cy="214" r="3.6" opacity=".85"/>
      <circle cx="396" cy="330" r="2.6" opacity=".6"/>
      <circle cx="286" cy="58" r="2.4" opacity=".6"/>
      <path d="M430 128 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
    </g>
    <!-- croissant de lune : « الليل », la nuit -->
    <rect width="512" height="512" fill="url(#lune)" mask="url(#croissant)"/>

    <!-- plan d'eau -->
    <path d="M0 432 C60 410 110 452 176 432 C236 414 290 452 350 434 C410 416 460 440 512 426 V512 H0 Z" fill="url(#eau)"/>
    <path d="M0 462 C70 444 120 478 190 462 C250 448 300 478 362 462 C420 448 470 466 512 456 V512 H0 Z" fill="#075985" opacity=".55"/>

    <!-- feuille -->
    <path d="M150 400 C106 250 226 116 372 104 C400 252 300 402 150 400 Z" fill="url(#feuille)"/>
    <path d="M372 104 C400 252 300 402 150 400 C214 352 236 300 268 258 C304 212 340 168 372 104 Z" fill="url(#ombre)"/>
    <!-- nervures -->
    <g fill="none" stroke="#ecfdf5" stroke-width="5" stroke-linecap="round" opacity=".5">
      <path d="M232 322 C204 300 184 270 176 236"/>
      <path d="M270 262 C248 238 236 208 236 176"/>
      <path d="M312 208 C298 188 294 164 300 140"/>
      <path d="M246 306 C280 312 312 304 338 286"/>
      <path d="M286 248 C316 252 344 242 364 224"/>
    </g>
    <!-- l'oued : nervure centrale qui devient rivière -->
    <path d="M372 104 C344 164 318 204 286 238 C252 276 240 308 222 352 C204 396 168 436 104 470 L176 478 C216 444 240 408 254 366 C268 322 276 292 304 256 C334 216 354 170 372 104 Z" fill="url(#oued)"/>
  </g>
</svg>
